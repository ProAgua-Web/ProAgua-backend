services:
  backend:
    container_name: "proagua-backend"
    build: .
    image: proagua-backend:latest
    ports:
      - 8000:8000
    networks:
      - mynet
    depends_on:
      - database
  
  database:
    container_name: "proagua-db"
    image: postgres:latest
    environment:
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_DB: ${DB_NAME}
    ports:
      - ${DB_PORT}:5432
    networks:
      - mynet

networks:
  mynet:
    driver: bridge
